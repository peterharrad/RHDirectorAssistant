# Provenance and pointers for every source document. No prose: parsing
# instructions live in parse-rules/ (declarative) and overrides/ (judgement).

bundle:
  title: "Riverside House Reading RTM Company"
  description: "Governing documents of the RTM company, one concept per unit of independent meaning."
  groups:                      # titles for the top-level folders of the bundle
    articles: "Articles of Association"
    leases: "Leases"
    agreements: "Agreements"
    guidance: "Guidance"
    titles: "Title registers"
    legislation: "Legislation"
    building: "Building"

